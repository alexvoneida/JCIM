name: Build

# Branch pushes automatically commit formatting fixes, then run the fast checks.
# There is no pull_request trigger: PRs show the status of their head commit's
# push run, so a second trigger would only run the same checks twice.
# Platform packaging runs only on main, and pushes to main publish a release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  format:
    name: Autoformat branch
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      changed: ${{ steps.format.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format and commit fixes
        id: format
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          npm run format
          git add -u
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "style: apply Prettier formatting"
          # A normal push rejects an update if the branch advanced while formatting.
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Verify the formatted commit
        if: steps.format.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        # GITHUB_TOKEN pushes do not trigger push workflows, so dispatch explicitly.
        run: gh workflow run build.yml --ref "$BRANCH"

  checks:
    name: Lint, typecheck, unit tests
    needs: format
    if: ${{ !cancelled() && (needs.format.result == 'success' || needs.format.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require verification of the formatted commit
        if: needs.format.outputs.changed == 'true'
        run: |
          echo "::error::Formatting fixes were pushed to this branch. The new Build run verifies that commit."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  windows-linux:
    name: Windows + Linux (Docker)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: artifacts
          outputs: type=local,dest=release
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v7
        with:
          name: windows-linux
          path: release/*
          if-no-files-found: error
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test the Linux AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox relies on.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          command -v xvfb-run || sudo apt-get install -y xvfb
          chmod +x release/*.AppImage
          JCIM_EXECUTABLE="$(ls "$PWD"/release/*.AppImage)" xvfb-run --auto-servernum npm run test:e2e

  windows-install:
    name: Windows install test
    needs: windows-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-linux
          path: release
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install silently and verify shortcuts
        shell: pwsh
        run: |
          $installer = Get-ChildItem release\*-Setup-*.exe | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList '/S' -Wait
          # The single-instance lock would make the test's launch exit if the installer started the app.
          Stop-Process -Name JCIM -ErrorAction SilentlyContinue

          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter JCIM.exe | Select-Object -First 1
          if (-not $exe) { throw 'JCIM.exe was not installed under %LOCALAPPDATA%\Programs' }

          $shortcuts = @(
            (Join-Path ([Environment]::GetFolderPath('Desktop')) 'JCIM.lnk'),
            (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\JCIM.lnk')
          )
          foreach ($shortcut in $shortcuts) {
            if (-not (Test-Path $shortcut)) { throw "Missing shortcut: $shortcut" }
          }

          "JCIM_EXECUTABLE=$($exe.FullName)" >> $env:GITHUB_ENV
      - name: Test the installed app
        run: npm run test:e2e

  macos:
    name: macOS
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
      - name: Test the packaged app
        run: JCIM_EXECUTABLE="$PWD/release/mac-universal/JCIM.app/Contents/MacOS/JCIM" npm run test:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: release/*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, windows-linux, windows-install, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}-build.${RUN_NUMBER}"
          gh release create "$tag" release/* \
            --target "$GITHUB_SHA" \
            --title "JCIM $tag" \
            --generate-notes \
            --latest
