appId: com.jcim.desktop
productName: JCIM
directories:
  output: release
  buildResources: build
files:
  - out/**/*

win:
  target: nsis
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  artifactName: ${productName}-Setup-${version}.${ext}

mac:
  target:
    - target: dmg
      arch: universal
  # Ad-hoc signature so the app launches on Apple Silicon. Remove both lines
  # once a real Developer ID certificate is configured.
  identity: '-'
  hardenedRuntime: false
dmg:
  artifactName: ${productName}-${version}-mac.${ext}

linux:
  target: AppImage
  category: Office
appImage:
  artifactName: ${productName}-${version}-linux.${ext}
